<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colabore com a Negociação Criativa | Inova Pública</title>
  <meta name="description" content="Cadastre-se para colaborar com o desenvolvimento da Negociação Criativa no setor público.">
  <style>
    :root{--black:#050504;--ink:#fffdf7;--muted:#d8d0bf;--gold:#f0c878;--yellow:#ffd43b;--line:rgba(240,200,120,.28);--glass:rgba(255,248,230,.07)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black);color:var(--ink)}
    body{font-family:Georgia,Cambria,"Times New Roman",serif;background:radial-gradient(circle at 12% 14%,rgba(240,200,120,.15),transparent 30%),radial-gradient(circle at 90% 84%,rgba(200,148,63,.1),transparent 32%),#050504}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,rgba(255,248,230,.25) 0 1px,transparent 1.5px);background-size:76px 76px;mask-image:linear-gradient(120deg,#000,transparent 75%)}
    main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,.8fr);gap:clamp(32px,6vw,88px);align-items:center;width:min(1120px,calc(100% - 40px));min-height:100vh;margin:auto;padding:40px 0}
    .kicker{margin:0 0 14px;color:var(--gold);font:800 12px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
    h1{max-width:650px;margin:0;font-size:clamp(42px,5vw,72px);line-height:1;letter-spacing:-.04em}
    h1 span{color:var(--gold)}
    .lead{max-width:600px;margin:20px 0 0;color:var(--muted);font-size:clamp(17px,1.6vw,21px);line-height:1.4}
    .promise{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    .promise span{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font:700 13px/1 system-ui,sans-serif;color:var(--muted)}
    .card{padding:clamp(28px,4vw,46px);border:1px solid var(--line);border-radius:28px;background:rgba(15,14,11,.9);box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
    .card h2{margin:0 0 8px;font-size:clamp(28px,3vw,40px);line-height:1.08}
    .card>p{margin:0 0 27px;color:var(--muted);font:500 15px/1.5 system-ui,sans-serif}
    label{display:block;margin-top:17px;color:var(--muted);font:800 12px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
    input[type=text],input[type=tel]{width:100%;margin-top:8px;padding:15px 16px;border:1px solid var(--line);border-radius:13px;outline:0;background:rgba(255,255,255,.055);color:var(--ink);font:600 17px/1.2 system-ui,sans-serif}
    input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,212,59,.12)}
    .consent{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;margin:20px 0 0;color:var(--muted);font:500 12px/1.45 system-ui,sans-serif;text-transform:none;letter-spacing:0}
    .consent input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--yellow)}
    button{width:100%;margin-top:22px;padding:16px 20px;border:0;border-radius:999px;background:var(--yellow);color:#090705;cursor:pointer;font:900 16px/1 system-ui,sans-serif;transition:transform .2s,filter .2s}
    button:hover{transform:translateY(-2px);filter:brightness(1.04)}button:disabled{cursor:wait;opacity:.68;transform:none}
    .status{min-height:20px;margin:14px 0 0;text-align:center;color:var(--muted);font:700 12px/1.4 system-ui,sans-serif}
    .hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    @media(max-width:850px){main{grid-template-columns:1fr;gap:18px;width:min(100% - 24px,560px);padding:20px 0 28px;align-items:start}.intro{text-align:center}.kicker{margin-bottom:8px}h1{font-size:clamp(32px,9vw,44px);line-height:1.02}.lead{margin:10px auto 0;font-size:15px;line-height:1.35}.promise{display:none}.card{padding:24px 20px;border-radius:22px}.card h2{font-size:28px}.card>p{margin-bottom:16px;font-size:14px}label{margin-top:13px}input[type=text],input[type=tel]{padding:13px 14px}.consent{margin-top:16px}button{margin-top:17px}}
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <p class="kicker">Canvas de Negociação Criativa</p>
      <h1>Colabore com a <span>Negociação Criativa.</span></h1>
      <p class="lead">Deixe seus dados e ajude a transformar boas ideias em acordos possíveis.</p>
      <div class="promise"><span>Valor público</span><span>Inovação colaborativa</span><span>Acordos criativos</span></div>
    </section>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Quero colaborar</h2>
      <p>Preencha seus dados para conhecer a proposta completa e acompanhar os próximos passos.</p>
      <form id="leadForm" method="post" action="https://script.google.com/macros/s/AKfycbzIMY7R5T9Ut3mZ-jR8ElDw7BzjtY9Ys3lyjnUfI6gUZxMaTVwiA3DcwBOlvN-LWeUF/exec" target="submitFrame">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" maxlength="120" required>
        <label for="whatsapp">Telefone (WhatsApp)</label>
        <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" placeholder="(61) 99999-9999" pattern="[0-9()+ .-]{8,24}" required>
        <label for="orgao">Órgão de origem</label>
        <input id="orgao" name="orgao" type="text" autocomplete="organization" maxlength="160" required>
        <div class="hp" aria-hidden="true"><label for="website">Não preencher</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <input name="origem" type="hidden" value="Fest Talks 2026">
        <label class="consent"><input name="consentimento" type="checkbox" value="sim" required><span>Autorizo o uso destes dados para contato sobre a Negociação Criativa. Os dados não serão divulgados publicamente.</span></label>
        <button id="submitButton" type="submit">Enviar e acessar o Canvas</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <iframe name="submitFrame" id="submitFrame" title="Envio do formulário" hidden></iframe>
    </section>
  </main>
  <script>
    const form=document.querySelector('#leadForm'),button=document.querySelector('#submitButton'),statusBox=document.querySelector('#status'),frame=document.querySelector('#submitFrame');
    let submitted=false;
    form.addEventListener('submit',event=>{
      if(form.action.includes('GOOGLE_APPS_SCRIPT_EXEC_URL')){event.preventDefault();statusBox.textContent='Formulário aguardando ativação do Google Sheets.';return}
      submitted=true;button.disabled=true;button.textContent='Registrando seus dados...';statusBox.textContent='Aguarde um instante.';
    });
    frame.addEventListener('load',()=>{
      if(!submitted)return;
      statusBox.textContent='Cadastro realizado. Abrindo o Canvas...';
      setTimeout(()=>location.href='https://www.inovapublica.com.br/canvas-negociacao-criativa/',700);
    });
  </script>
</body>
</html>
